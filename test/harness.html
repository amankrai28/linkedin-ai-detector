<!DOCTYPE html>
<html>
<!--
  LinkedIn AI Detector — offline regression harness (Layer 2 / DOM-change net)

  Purpose: load the REAL extension code (scoring/*.js + content.js + ui/overlay.js,
  in exact manifest order) in a real browser against a captured DOM fixture, then
  assert (#.laid-score-badge === #posts). This catches "LinkedIn renamed their
  DOM and detection silently died" regressions — the failure class the offline
  net CAN reproduce. It does NOT reproduce the live scroll-pipeline bug (that
  needs LinkedIn's real virtualization + IntersectionObserver timing — drive that
  on linkedin.com via Chrome MCP).

  MUST run in a real browser (NOT jsdom): detection relies on innerText, layout
  (offsetHeight/getBoundingClientRect), and -webkit-line-clamp — all of which
  jsdom stubs out, yielding false results.

  fetch() is blocked on file://, so serve the repo over HTTP and open this page:
      python3 -m http.server 8754        # from the repo root
      open http://localhost:8754/test/harness.html
  Swap fixtures with ?fixture=NAME.html (default: feed-synthetic.html):
      http://localhost:8754/test/harness.html?fixture=feed-live.html

  Machine-readable verdict for an MCP driver: window.__laidTestResult and the
  <html data-laid-test="..."> attribute.
-->
<head>
  <meta charset="utf-8">
  <title>LAID offline regression harness</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    html, body { margin: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #feed-root { padding: 16px; margin-right: 420px; }
    #out {
      position: fixed; top: 0; right: 0; width: 400px; height: 100vh;
      margin: 0; padding: 12px; box-sizing: border-box; overflow: auto;
      background: #14161a; color: #d7dbe0; z-index: 2147483647;
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap; word-break: break-word;
    }
    .laid-pass { color: #5dd55d; font-weight: 700; }
    .laid-fail { color: #ff6b6b; font-weight: 700; }
    .laid-dim  { color: #8a93a0; }
  </style>
</head>
<body>
  <div id="feed-root"></div>
  <pre id="out">loading…</pre>

  <!-- 1. Shim chrome.* and set test mode BEFORE any extension script runs. -->
  <script>
    // Per-post DEBUG logs ON, so each detection near-miss prints its reason to
    // the console (readable via MCP read_console_messages on this tab).
    try { localStorage.setItem('laid_debug', '1'); } catch (_) {}

    // Test mode: content.js must NOT auto-run its init scan, attach the
    // MutationObserver, or install retry timers — the harness drives
    // processAllPosts() explicitly for a deterministic assertion. (content.js
    // gates all of that behind `if (!window.__laid_test)`.)
    window.__laid_test = true;

    // Minimal MV3 chrome shim. content.js (GET_SETTINGS, POST_SCORED,
    // onMessage) and scoring/ml-detector.js (ML_SCORE_REQUEST) call into this.
    function __laidShimReply(msg) {
      if (msg && msg.type === 'GET_SETTINGS') return { enabled: true, displayMode: 'badge', apiKey: '' };
      if (msg && msg.type === 'ML_SCORE_REQUEST') return { success: false }; // heuristic-only offline
      return { ok: true };
    }
    window.chrome = {
      runtime: {
        // MV3 returns a Promise when no callback is supplied (the ML path awaits it).
        sendMessage(msg, cb) {
          if (typeof cb === 'function') { setTimeout(() => cb(__laidShimReply(msg)), 0); return; }
          return Promise.resolve(__laidShimReply(msg));
        },
        onMessage: { addListener() {}, removeListener() {} },
        getManifest() { return { update_url: 'shim' }; }, // pretend "packed" → dev bridge inert
        lastError: null,
      },
      storage: {
        local:   { get(_k, cb) { cb && cb({}); }, set(_v, cb) { cb && cb(); } },
        session: { get(_k, cb) { cb && cb({}); }, set(_v, cb) { cb && cb(); } },
      },
    };
  </script>

  <!-- 2. Extension scripts in EXACT manifest order. -->
  <script src="../scoring/vocabulary.js"></script>
  <script src="../scoring/structure.js"></script>
  <script src="../scoring/stylometry.js"></script>
  <script src="../scoring/linkedin.js"></script>
  <script src="../scoring/ml-preprocess.js"></script>
  <script src="../scoring/ml-detector.js"></script>
  <script src="../scoring/engine.js"></script>
  <script src="../content.js"></script>
  <script src="../ui/overlay.js"></script>

  <!-- 3. Harness driver. -->
  <script>
  (async function () {
    const out = document.getElementById('out');
    out.textContent = '';
    const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
    const log = (s, cls) => out.insertAdjacentHTML('beforeend', `<span class="${cls || ''}">${esc(s)}</span>\n`);

    const fixture = new URLSearchParams(location.search).get('fixture') || 'feed-synthetic.html';
    log(`fixture: ${fixture}`, 'laid-dim');

    let html;
    try {
      const res = await fetch('fixtures/' + fixture);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      html = await res.text();
    } catch (e) {
      log('FAILED to load fixture — are you serving over HTTP? (file:// fetch is blocked)', 'laid-fail');
      log('  ' + e.message, 'laid-fail');
      return;
    }

    const root = document.getElementById('feed-root');
    root.innerHTML = html;

    // Expected post count. Synthetic fixtures tag each post with data-test-post.
    // A raw live capture has none, so fall back to control-menu buttons (the
    // most reliable 1:1 per-post marker LinkedIn must render for a11y).
    let expected = root.querySelectorAll('[data-test-post]').length;
    let expectedSource = 'data-test-post';
    if (expected === 0) {
      expected = root.querySelectorAll('button[aria-label^="Open control menu for post by"]').length;
      expectedSource = 'control-menu buttons';
    }
    log(`expected posts: ${expected} (counted by ${expectedSource})`);

    if (!window.__laid || typeof window.__laid.processAllPosts !== 'function') {
      log('window.__laid hook missing — content.js did not expose its test handle', 'laid-fail');
      return;
    }

    window.__laid.resetCounters();
    window.__laid.resetQueue();

    // Let layout settle. NOTE: use setTimeout, NOT requestAnimationFrame —
    // rAF callbacks are suspended in background/unfocused tabs, which is
    // exactly how an MCP driver opens this page, so an rAF await would hang
    // forever. setTimeout still fires (throttled) in background tabs. Layout
    // values (innerText/getComputedStyle) are computed synchronously on demand
    // regardless, so a real paint isn't needed.
    await new Promise(r => setTimeout(r, 50));

    // In test mode processAllPosts awaits the serial queue, so every post is
    // scored + badged by the time this resolves.
    await window.__laid.processAllPosts();
    await new Promise(r => setTimeout(r, 50));

    const c = window.__laid.getCounters();
    const badges = document.querySelectorAll('.laid-score-badge').length;

    log('');
    log(`detected (findPostContainers): ${c.postsFound}`);
    log(`badges rendered:               ${badges}`);
    log(`counters: ${JSON.stringify(c)}`, 'laid-dim');

    const pass = expected > 0 && badges === expected && c.postsFound === expected;
    log('');
    log(`RESULT: ${pass ? 'PASS' : 'FAIL'} — badges=${badges} detected=${c.postsFound} expected=${expected}`,
        pass ? 'laid-pass' : 'laid-fail');

    if (!pass) {
      log('', 'laid-dim');
      log('Misses (see console for per-candidate MISS reasons):', 'laid-dim');
      const tagged = root.querySelectorAll('[data-test-post]');
      if (tagged.length) {
        tagged.forEach((p, i) => {
          const badged = p.querySelector('.laid-score-badge') || p.classList.contains('laid-container');
          if (!badged) log(`  post#${i} — no badge`, 'laid-fail');
        });
      }
    }

    const result = { pass, badges, detected: c.postsFound, expected, counters: c, fixture };
    window.__laidTestResult = result;
    try { document.documentElement.setAttribute('data-laid-test', JSON.stringify(result)); } catch (_) {}
  })();
  </script>
</body>
</html>
