<!DOCTYPE html>
<html>
<!--
  LinkedIn AI Detector — STRESS / micro-bench harness (instruments 2 & 3)

  The GATING measurements for the jank fixes. Both are SYNCHRONOUS — they time a
  findPostContainers() pass with performance.now() — so they are trustworthy even in
  a headless / backgrounded tab (no rAF, no IntersectionObserver, no real scroll,
  no paint needed; layout values compute synchronously on demand).

    Instrument 2 — Cause A (forced-layout scan storm). Over an N-post tree, repeat:
      dirty layout (toggle a geometry style on the feed wrapper) → run ONE
      findPostContainers pass so the scan's innerText reads hit a dirty tree and
      force a reflow → record ms. Reports median + p95 ms/pass. Fix A (innerText →
      textContent in the scan path) must drop this sharply vs the recorded baseline
      on this IDENTICAL bench. If it doesn't move, Fix A is wrong.

    Instrument 3 — Cause B (badge-cost differential, the Fix-B DECISION). Run the
      same bench twice over the SAME tree: once with no badges, once after rendering
      a real badge + .laid-container on every post (WITHOUT the processed marker, so
      the scan still traverses them). Δ = the extra layout cost our DOM mutation
      imposes on LinkedIn's tree. Fix B is built ONLY if Δ is materially above noise.

  Runs in __laid_test=true mode ON PURPOSE: that disables content.js's live
  MutationObserver + scroll sweep + init scan, so the live pipeline can't auto-badge
  / auto-mark the bench tree and corrupt the measurement. The benches drive
  window.__laid.findPostContainers() directly. (The REAL observer + scroll-sweep
  wiring is exercised separately in harness-pipeline.html — instrument 1.)

  Serve over HTTP from the repo root, then open:
      python3 -m http.server 8754
      http://localhost:8754/test/harness-stress.html         (N=150, iters=80)
      http://localhost:8754/test/harness-stress.html?n=300&iters=120
  Machine-readable verdict: window.__laidStress and <html data-laid-stress="...">.
-->
<head>
  <meta charset="utf-8">
  <title>LAID stress / micro-bench</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    html, body { margin: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #bench-feed { padding: 16px; margin-right: 460px; }
    #out {
      position: fixed; top: 0; right: 0; width: 440px; height: 100vh;
      margin: 0; padding: 12px; box-sizing: border-box; overflow: auto;
      background: #14161a; color: #d7dbe0; z-index: 2147483647;
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap; word-break: break-word;
    }
    .laid-pass { color: #5dd55d; font-weight: 700; }
    .laid-fail { color: #ff6b6b; font-weight: 700; }
    .laid-dim  { color: #8a93a0; }
    .laid-hi   { color: #ffd166; }
  </style>
</head>
<body>
  <main>
    <div id="bench-feed"></div>
  </main>
  <pre id="out">loading…</pre>

  <!-- 1. Shim chrome.* + test mode BEFORE any extension script runs. -->
  <script>
    try { localStorage.setItem('laid_debug', '1'); } catch (_) {}
    // Test mode: no live MutationObserver / scroll sweep / init scan, so the
    // benches fully control marking + badging of the tree they measure.
    window.__laid_test = true;
    function __laidShimReply(msg) {
      if (msg && msg.type === 'GET_SETTINGS') return { enabled: true, displayMode: 'badge', apiKey: '' };
      if (msg && msg.type === 'ML_SCORE_REQUEST') return { success: false };
      return { ok: true };
    }
    window.chrome = {
      runtime: {
        sendMessage(msg, cb) {
          if (typeof cb === 'function') { setTimeout(() => cb(__laidShimReply(msg)), 0); return; }
          return Promise.resolve(__laidShimReply(msg));
        },
        onMessage: { addListener() {}, removeListener() {} },
        getManifest() { return { update_url: 'shim' }; },
        lastError: null,
      },
      storage: {
        local:   { get(_k, cb) { cb && cb({}); }, set(_v, cb) { cb && cb(); } },
        session: { get(_k, cb) { cb && cb({}); }, set(_v, cb) { cb && cb(); } },
      },
    };
  </script>

  <!-- 2. Extension scripts in EXACT manifest order. -->
  <script src="../scoring/vocabulary.js"></script>
  <script src="../scoring/structure.js"></script>
  <script src="../scoring/stylometry.js"></script>
  <script src="../scoring/linkedin.js"></script>
  <script src="../scoring/ml-preprocess.js"></script>
  <script src="../scoring/ml-detector.js"></script>
  <script src="../scoring/engine.js"></script>
  <script src="../content.js"></script>
  <script src="../ui/overlay.js"></script>

  <!-- 3. Bench driver. -->
  <script>
  (async function () {
    const out = document.getElementById('out');
    out.textContent = '';
    const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
    const log = (s, cls) => out.insertAdjacentHTML('beforeend', `<span class="${cls || ''}">${esc(s)}</span>\n`);

    function publish(result) {
      window.__laidStress = result;
      try { document.documentElement.setAttribute('data-laid-stress', JSON.stringify(result)); } catch (_) {}
    }
    function fail(note, extra) {
      const r = Object.assign({ ok: false, error: note }, extra || {});
      log('ERROR: ' + note, 'laid-fail');
      publish(r);
    }

    const qp = new URLSearchParams(location.search);
    const N = Math.max(1, Number(qp.get('n') || 150));
    const ITERS = Math.max(10, Number(qp.get('iters') || 80));
    const WARMUP = Math.max(5, Number(qp.get('warmup') || 20));
    // Intermediate <div> wrappers between each post's body <p> and its post
    // container. Tuned so findSemanticAnchors' 5-ancestor walk-up from the body
    // lands exactly ON the post container (all of that post's anchors, none of a
    // sibling's) — otherwise a flat multi-post tree collapses into one container
    // (see fixtures/feed-synthetic.html's note). Verified by the detected===N
    // assertion below; bump/drop this if detection collapses.
    const WRAP_DEPTH = Math.max(0, Number(qp.get('wrap') || 5));

    if (!window.__laid || typeof window.__laid.findPostContainers !== 'function') {
      return fail('window.__laid.findPostContainers missing — content.js did not expose its test handle');
    }

    const BODY_TEXT =
      "I used to think productivity was about doing more but after years of optimizing " +
      "every hour I realized the highest leverage move is subtraction not addition. I " +
      "stopped measuring output in hours and started measuring outcomes that mattered to " +
      "customers. I cut every recurring meeting without a clear decision and the calendar " +
      "had room to breathe. We shipped faster, the team felt calmer, customers noticed.";

    function wrapDeep(inner, depth) {
      let s = inner;
      for (let d = 0; d < depth; d++) s = `<div class="w${d}">${s}</div>`;
      return s;
    }
    // Faithful per-post shape: header (profile link + timestamp + control-menu) and
    // an actions row (like/comment/repost/send) flank a deeply-wrapped body <p>.
    function makePost(i) {
      const body = `<p class="laid-bench-body" dir="ltr"><span>${i}: ${esc(BODY_TEXT)}</span></p>`;
      return `<div class="laid-bench-post">
        <div class="hdr">
          <a href="/in/author-${i}"><span>Author ${i}</span></a>
          <span class="ts">${(i % 12) + 1}h</span>
          <button type="button" aria-label="Open control menu for post by Author ${i}">&#8943;</button>
        </div>
        ${wrapDeep(body, WRAP_DEPTH)}
        <div class="acts">
          <button type="button">Like</button>
          <button type="button">Comment</button>
          <button type="button">Repost</button>
          <a href="#" role="button">Send</a>
        </div>
      </div>`;
    }

    const feed = document.getElementById('bench-feed');
    let html = '';
    for (let i = 0; i < N; i++) html += makePost(i);
    feed.innerHTML = html;
    log(`built ${N} posts (wrap depth ${WRAP_DEPTH}), iters=${ITERS}, warmup=${WARMUP}`, 'laid-dim');

    // ── faithfulness gate: the scan must resolve N distinct posts, not collapse. ──
    const detected = window.__laid.findPostContainers().length;
    log(`detected by findPostContainers: ${detected} (want ${N})`, detected === N ? 'laid-dim' : 'laid-fail');
    if (detected !== N) {
      return fail(`generator collapsed: detected ${detected} != ${N}. Adjust ?wrap= so the 5-ancestor scope stays within one post.`, { n: N, detected });
    }

    // ?mark=1 — MARKED STEADY STATE: badge + mark + fingerprint every post the way
    // the live pipeline does, so the bench measures the scan cost when the feed is
    // already scored (what runs every ~800ms during scroll). This is the faithful
    // jank instrument: it exercises the dedup SKIP path, including Fix C's recycle
    // fingerprint check (querySelector + pickBodyTextElement) on every badged post.
    // postFingerprint/pickBodyTextElement/renderScoreBadge are globals here because
    // content.js + overlay.js load as plain <script>s in the main world.
    const MARK = qp.get('mark') === '1';
    if (MARK) {
      const fake = { score: 50, partial: false, blendMode: 'heuristic-only', layers: null };
      let marked = 0;
      for (const { container, textEl } of window.__laid.findPostContainers()) {
        try {
          if (typeof renderScoreBadge === 'function') renderScoreBadge(container, (textEl && textEl.textContent) || 'x', fake);
          container.setAttribute('data-laid-scored', 'true');
          if (typeof postFingerprint === 'function') container.setAttribute('data-laid-fp', postFingerprint(container));
          marked++;
        } catch (_) {}
      }
      const stillFound = window.__laid.findPostContainers().length;
      log(`MARK mode: badged+marked ${marked}/${N}; findPostContainers now returns ${stillFound} (want 0 — all skipped via dedup)`, stillFound === 0 ? 'laid-dim' : 'laid-fail');
    }

    const stats = (samples) => {
      const s = samples.slice().sort((a, b) => a - b);
      const at = (q) => s[Math.min(s.length - 1, Math.max(0, Math.floor(q * (s.length - 1))))];
      const sum = s.reduce((a, b) => a + b, 0);
      return { median: at(0.5), p95: at(0.95), min: s[0], max: s[s.length - 1], mean: sum / s.length, samples: s.length };
    };
    const round = (o) => {
      const r = {}; for (const k in o) r[k] = (k === 'samples') ? o[k] : Math.round(o[k] * 1000) / 1000; return r;
    };

    // One bench pass: dirty the feed wrapper's layout (geometry write → layout
    // invalidated), then time a single full-document findPostContainers scan.
    // With innerText reads (current code) the scan's first text read forces the
    // pending reflow inside the timed region; with textContent (Fix A) it doesn't.
    let _toggle = 0;
    function onePass() {
      feed.style.paddingTop = (_toggle++ & 1) ? '0px' : '2px'; // dirties layout, no read
      const t0 = performance.now();
      const found = window.__laid.findPostContainers();
      const dt = performance.now() - t0;
      return { dt, count: found.length };
    }
    function bench() {
      for (let i = 0; i < WARMUP; i++) onePass();
      const samples = [];
      let count = 0;
      for (let i = 0; i < ITERS; i++) { const r = onePass(); samples.push(r.dt); count = r.count; }
      return { stat: stats(samples), count };
    }

    // Forced-reflow attribution (Cause A mechanism): read each post body with
    // layout RE-DIRTIED before every read, so innerText forces a reflow per read
    // (the live-feed thrash, where LinkedIn re-dirties layout between our reads)
    // while textContent never touches layout. The gap IS the forced-layout cost
    // Fix A removes — proving the scan's cost is layout, not traversal. (The
    // findPostContainers benches measure the actual changed code; this proves WHY.)
    function readStorm(useInner) {
      const els = feed.querySelectorAll('p.laid-bench-body');
      let acc = 0, k = 0;
      const t0 = performance.now();
      for (const el of els) {
        feed.style.paddingTop = (k++ & 1) ? '0px' : '3px'; // re-dirty → next text read forces a reflow
        const t = useInner ? el.innerText : el.textContent;
        acc += t ? t.length : 0;
      }
      return performance.now() - t0;
    }
    // Pure layout-flush (Cause B, scan-independent): re-dirty layout before each
    // of N forced reflows (offsetHeight), aggregated so the per-reflow cost rises
    // above timer resolution. The only variable across the two runs is whether
    // our badges + .laid-container are present in the tree being laid out.
    function flushStorm() {
      const posts = feed.querySelectorAll('.laid-bench-post');
      let acc = 0, k = 0;
      const t0 = performance.now();
      for (const p of posts) {
        feed.style.paddingTop = (k++ & 1) ? '0px' : '3px'; // re-dirty → next geometry read forces reflow
        acc += p.offsetHeight;
      }
      return performance.now() - t0;
    }
    function medianOf(fn, n) { const a = []; for (let i = 0; i < n; i++) a.push(fn()); return stats(a); }

    // ── Instrument 2 — Cause A baseline: scan cost with NO badges. ──
    log('running Cause-A bench (no badges)…', 'laid-dim');
    const noBadge = bench();
    log(`Cause A  (no badges): median ${noBadge.stat.median.toFixed(3)}ms  p95 ${noBadge.stat.p95.toFixed(3)}ms  (per post ~${(noBadge.stat.median / N).toFixed(4)}ms)`, 'laid-hi');

    // Mechanism proof: forced-layout cost of innerText vs textContent over the
    // same N bodies, re-dirtying layout before each read.
    for (let i = 0; i < 5; i++) { readStorm(true); readStorm(false); } // warm
    const stormInner = medianOf(() => readStorm(true), 15);
    const stormText = medianOf(() => readStorm(false), 15);
    const stormSaved = stormInner.median - stormText.median;
    log(`forced-reflow read-storm over ${N} bodies: innerText ${stormInner.median.toFixed(3)}ms  vs  textContent ${stormText.median.toFixed(3)}ms  (saves ${stormSaved.toFixed(3)}ms — the layout-coupled cost Fix A removes)`, 'laid-hi');

    // Pure layout-flush storm, NO badges (Cause-B baseline, scan-independent).
    for (let i = 0; i < 3; i++) flushStorm(); // warm
    const flushNoBadge = medianOf(flushStorm, 15);

    // ── Instrument 3 — Cause B: render a real badge + .laid-container on every
    // post, but DO NOT set the processed marker, so findPostContainers still
    // traverses every post and the only delta is the layout cost of our DOM. ──
    const fakeResult = { score: 50, partial: false, blendMode: 'heuristic-only', layers: null };
    let badged = 0;
    for (const { container, textEl } of window.__laid.findPostContainers()) {
      try {
        container.classList.add('laid-container'); // position:relative !important — the Cause-B mutation
        const s = (typeof renderScoreBadge === 'function') ? renderScoreBadge(container, (textEl && textEl.textContent) || 'x', fakeResult) : -1;
        if (s !== -1) badged++;
      } catch (_) {}
    }
    log(`rendered ${badged} badges + .laid-container (no processed marker)`, 'laid-dim');
    const detected2 = window.__laid.findPostContainers().length;
    if (detected2 !== N) log(`  warning: detection changed after badging: ${detected2} != ${N}`, 'laid-fail');

    log('running Cause-B bench (with badges)…', 'laid-dim');
    const withBadge = bench();
    log(`Cause B (with badges): median ${withBadge.stat.median.toFixed(3)}ms  p95 ${withBadge.stat.p95.toFixed(3)}ms`, 'laid-hi');

    // Pure layout-flush storm WITH badges — the scan-independent Cause-B signal.
    for (let i = 0; i < 3; i++) flushStorm(); // warm
    const flushWithBadge = medianOf(flushStorm, 15);

    const deltaMedian = withBadge.stat.median - noBadge.stat.median;
    const deltaP95 = withBadge.stat.p95 - noBadge.stat.p95;
    const pctMedian = noBadge.stat.median > 0 ? (deltaMedian / noBadge.stat.median) * 100 : 0;
    const flushDelta = flushWithBadge.median - flushNoBadge.median;
    const flushPct = flushNoBadge.median > 0 ? (flushDelta / flushNoBadge.median) * 100 : 0;
    log('');
    log(`Cause-B Δ (scan):   median +${deltaMedian.toFixed(3)}ms (${pctMedian.toFixed(1)}%)  p95 +${deltaP95.toFixed(3)}ms`,
        Math.abs(pctMedian) > 10 ? 'laid-hi' : 'laid-dim');
    log(`Cause-B Δ (layout): flush ${flushNoBadge.median.toFixed(3)}ms → ${flushWithBadge.median.toFixed(3)}ms = +${flushDelta.toFixed(3)}ms (${flushPct.toFixed(1)}%)`,
        Math.abs(flushPct) > 10 ? 'laid-hi' : 'laid-dim');
    log('(Fix B ships only if these Δ are materially above noise; else it is skipped — a measured decision.)', 'laid-dim');

    publish({
      ok: true,
      n: N, iters: ITERS, detected,
      noBadge: round(noBadge.stat),
      withBadge: round(withBadge.stat),
      badgeDeltaMedianMs: Math.round(deltaMedian * 1000) / 1000,
      badgeDeltaP95Ms: Math.round(deltaP95 * 1000) / 1000,
      badgeDeltaPct: Math.round(pctMedian * 10) / 10,
      forcedReflow: {
        innerTextMedianMs: Math.round(stormInner.median * 1000) / 1000,
        textContentMedianMs: Math.round(stormText.median * 1000) / 1000,
        savedMs: Math.round(stormSaved * 1000) / 1000,
      },
      layoutFlush: {
        noBadgeMedianMs: Math.round(flushNoBadge.median * 1000) / 1000,
        withBadgeMedianMs: Math.round(flushWithBadge.median * 1000) / 1000,
        deltaMs: Math.round(flushDelta * 1000) / 1000,
        deltaPct: Math.round(flushPct * 10) / 10,
      },
    });
    log('');
    log('DONE — window.__laidStress / data-laid-stress published.', 'laid-pass');
  })().catch((e) => {
    const out = document.getElementById('out');
    if (out) out.insertAdjacentHTML('beforeend', `<span class="laid-fail">EXCEPTION: ${String(e && e.message || e)}</span>\n`);
    const r = { ok: false, error: String(e && e.message || e) };
    window.__laidStress = r;
    try { document.documentElement.setAttribute('data-laid-stress', JSON.stringify(r)); } catch (_) {}
  });
  </script>
</body>
</html>
